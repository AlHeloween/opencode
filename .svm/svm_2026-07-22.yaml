# ============================================================================
# State Vector Manifest — EXAMPLE
# ============================================================================
# An SVM is the per-turn state artifact of the ADID framework: one YAML per
# development turn, replacing conversational memory with a machine-readable
# document that a fresh reader can act on (docs/ADID_Framework_15_3.md,
# § The State Vector Manifest).
#
# What each block is FOR:
#   header          session_id / turn_id / parent_turn_id — the manifest CHAINS
#                   turn to turn, so continuity is read rather than recalled.
#   master_plan     one paragraph: the state of the work at this turn.
#   goals[]         the turn's goals, each with a semantic vector (a dominant and
#                   weighted key phrases) AND the commit(s) that closed it —
#                   a goal is done when a hash proves it, not when prose says so.
#   tasks[]         the goals split into atomic, individually checkable steps.
#   test_status     the oracles, with counts. A manifest without numbers is a wish.
#   goal_hierarchy  the fractal: every level names its own dominant, so a reader
#                   can descend from "what are we doing" to "what is this task".
#
# Relation to today's Layer-1 summary (docs/compaction.md): the summary is the
# surviving half of this idea. The STATE moved to the system-Exact planState
# mirror, and the model keeps only ONE anchor it can honestly judge — `dominant`.
# Invented `key_phrases` were removed for having zero consumers; the real task
# vectors live in the plan, which has readers. This file is kept as a worked
# example of the full shape — not as a live format.
#
# Provenance: distilled from the real manifest of 2026-07-22 (commit fc59ac1e0f);
# the session id is replaced with a placeholder, commit hashes are historical.
# ============================================================================


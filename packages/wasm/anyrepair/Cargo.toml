[package]
name = "anyrepair-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for anyrepair — malformed JSON/XML/YAML repair for LLM output"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
anyrepair = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

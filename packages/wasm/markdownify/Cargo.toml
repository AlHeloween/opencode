[package]
name = "markdownify-wasm"
version = "0.1.0"
edition = "2021"
description = "Universal document to markdown converter compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
markdownify = "0.3.2"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
feed-rs = { version = "2.3.1", default-features = false }
kamadak-exif = "0.6.1"
html2md = "0.2.15"
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
thiserror = "2.0.11"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
uuid = { version = "1.0", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

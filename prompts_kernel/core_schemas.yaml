# core_schemas.yaml — Single source of truth for all data structures.
# Version: 1.0
# All schema changes go HERE.  Fragments reference via @schema:section_name.
# Build pipeline (assemble_reasoning) resolves refs and injects YAML inline.
# The model sees full schemas; the developer edits only this file.

version: "1.0"

# GATES — 9-gate workflow spine
# rules/steps/diagrams/schemas MUST be @REFS into RULES / Algorithms / Schemas / Diagrams.
# Bare identifiers (e.g. SV_EVERY_TURN without @) are bugs — not dictionary lookups.
gates:
  GATE_1_GROUND: "{tag: GATE_1_GROUND, name: GROUND, rules: [@EVIDENCE_ORDER, @SEARCH_ORDER, @WHERE_WHICH, @REUSE_BEFORE, @GROUND, @NO_HARDCODE, @VCS_ROOT, @READ_ENTIRE_FILE], intent: [where/which, codegraph, sessionread, universalsearch]}"
  GATE_2_DECOMPOSE: "{tag: GATE_2_DECOMPOSE, name: DECOMPOSE, rules: [@DECOMPOSE, @FRACTAL_CANDIDATES, @GOAL_SEEDS, @GOAL_PEAKS, @SV_DELTA, @METRIC_ADAPTATION], model: Manhattan_L1}"
  GATE_3_MASTER_PLAN: "{tag: GATE_3_MASTER_PLAN, name: MASTER_PLAN, rules: [@SMOKE_BEFORE, @SMOKE_SPEC, @SMOKE_VALIDATE, @INFOMARK_SEP], output: master_plan}"
  GATE_4_AUTHORIZE: "{tag: GATE_4_AUTHORIZE, name: AUTHORIZE, rules: [@WRITE_SCOPE], branches: {envelope_ok: GATE_6_GROUND_PLAN, needs_approval: ask, concern: GATE_2_DECOMPOSE}}"
  GATE_5_CONCERN_LOOP: "{tag: GATE_5_CONCERN_LOOP, name: CONCERN_LOOP, target: GATE_2_DECOMPOSE}"
  GATE_6_GROUND_PLAN: "{tag: GATE_6_GROUND_PLAN, name: GROUND_PLAN, rules: [@SEARCH_ORDER, @REUSE_BEFORE], phases: [codegraph, explore, gap_fill]}"
  GATE_7_IMPLEMENT: "{tag: GATE_7_IMPLEMENT, name: IMPLEMENT, rules: [@CACHE_STABILITY, @CONSTITUTION_BLOCKS, @ADID_OPS, @NO_SCRIPT_EDITING, @READ_ENTIRE_FILE]}"
  GATE_8_ORACLE: "{tag: GATE_8_ORACLE, name: ORACLE, rules: [@VERIFY_OUTCOME, @SMOKE_VERIFY], pass: stamp(Exact), fail: demote(Guess)}"
  GATE_9_CLEAN_STATE: "{tag: GATE_9_CLEAN_STATE, name: CLEAN_STATE, rules: [@CLEAN_STATE, @SV_OUTPUT, @SV_EVERY_TURN, @RESIDUAL_LOOP, @EMIT_STATE, @PLANS_COMPLETED], terminal_mode: [BLOCKED, OUT_OF_SCOPE, SUCCESS]}"

# SEMANTIC VECTOR (SV)
sv_output:
  tag: SV_OUTPUT_SCHEMA
  see: "@SV_FORMAT"

sv_target:
  tag: SV_TARGET
  description: "Forward-looking attention primer — emitted BEFORE action to steer transformer attention"
  structure: "same YAML as @SV_FORMAT: Keywords + weights + Semantic dominant"
  vs_sv_format: "TARGET = intent (forward), FORMAT = accomplishment (backward)"
  attention_accuracy: "δ = d₁(SV_TARGET, SV_FORMAT) — how close actual attention was to intended"
  sub_agent_use: "orchestrator assigns per-agent SV_TARGET for diversity via orthogonal weight vectors"
  invariant: "NOT a claim status — no epistemic weight, purely attention steering"

# SV TRAJECTORY
sv_trajectory:
  tag: SV_TRAJECTORY
  description: "Multi-step semantic position tracking for drift detection"
  extends: "@SV_DELTA"
  metrics:
    goal_distance: "D_g = d₁(S_t, G) — drift from original Goal SV"
    step_distance: "D_p = d₁(S_t, S_{t-1}) — per-step change"
    velocity: "v_t = D_p per turn"
    coverage: "C_g = fraction of Goal dimensions with cumulative weight ≥ 0.5"
  drift_classification:
    stable_convergence: "D_g < 0.3 ∧ D_p < 0.3 — on target"
    exploration: "D_g < 0.3 ∧ D_p ≥ 0.3 — exploring around goal"
    stable_drift: "D_g ≥ 0.6 ∧ D_p < 0.3 — DANGEROUS: wrong problem, confidently"
    divergence: "D_g ≥ 0.6 ∧ D_p ≥ 0.3 — uncontrolled"
    transitional: "otherwise — accumulating evidence"
  rules:
    - "stable_drift ≥ 2 consecutive turns → re-anchor via @GATE_1_GROUND + emit SV_TARGET"
    - "step_distance spike ≥ 0.5 above median → verify against plan"
  invariant: "Same Manhattan L1 metric as @SV_DELTA and @FRACTAL_GEOMETRY"

# SEMANTIC CONTROL (orchestrator feedback loop)
semantic_control:
  tag: SEMANTIC_CONTROL
  description: "Orchestrator-level SV feedback loop — extends @MULTI_AGENT_SV"
  goal_sv: "original Goal SV — reference point for all measurements"
  target_sv: "per-agent SV_TARGET — assigned by orchestrator for diversity"
  observed_sv: "per-agent SV_STATE — what the agent actually focused on"
  trajectory:
    previous: "SV from prior turn"
    velocity: "v_t = d₁(S_t, S_{t-1})"
    acceleration: "a_t = v_t − v_{t-1}"
  metrics:
    goal_distance: "d₁(S_t, G) — drift from Goal"
    step_distance: "d₁(S_t, S_{t-1}) — per-step change"
    coverage: "fraction of Goal dimensions covered by team"
    redundancy: "overlap between agents — lower is better for exploration"
    diversity: "minimum pairwise d₁ across agent team"
  controller:
    proportional_error: "d₁(target, observed) — immediate correction signal"
    accumulated_residual: "Σ(target − observed) over cycles — systemic bias"
    drift_derivative: "Δd₁(S_t, G) / Δt — rising = intervention needed"
  next_target_sv: "computed from controller + residual coverage map"
  stop_condition: "||R||₁ < 0.15 — semantic residual below threshold"
  invariant: "diversity floor: at least one agent pair with d₁ ≥ 0.15 to prevent tunnel vision"

# CLEAN NEXT STATE
clean_next_state:
  tag: CLEAN_NEXT_STATE
  description: "Structured state summary after each substantial turn"
  reason: string
  done: "list of {item: string, pct: int 0-100, mark: EpistemicStatus}"
  pending: "list of string"
  active: "list of string — currently executing tasks (derived from MASTER_PLAN.execution.current_task)"
  blocked: "list of {item: string, kind: real|fake, reason: string}"
  out_of_scope: "list of string — tasks discarded by residual_recluster"
  closure_gaps: "list of string — unresolved closure criteria when execution_exhausted but closure pending (derived from @OUTCOME_CONTRACT minus oracle stamps)"
  execution_exhausted: "bool — pending=[] AND active=[]; no more tasks to run"
  terminal: "enum: SUCCESS | BLOCKED | OUT_OF_SCOPE | CONTINUE — outcome decision, NOT task-exhaustion"
  closure_proof:
    acceptance_coverage: "float 0-1 — fraction of @OUTCOME_CONTRACT criteria proven via oracle stamps"
    critical_open_risks: "int — unresolved risks from @RISK_LEDGER blocking outcome acceptance"
    outcome_oracle: "PASS | FAIL | PENDING — aggregate oracle over all outcome acceptance criteria per @OUTCOME_CONTRACT"
    rule: "SUCCESS requires execution_exhausted=true AND acceptance_coverage >= outcome_contract.coverage_threshold AND critical_open_risks=0 AND outcome_oracle=PASS. CONTINUE when exhausted but closure pending."
  terminal_mode:
    enum: ["SUCCESS", "BLOCKED", "OUT_OF_SCOPE", "CONTINUE", "RESUME"]
    precedence: "BLOCKED > OUT_OF_SCOPE > SUCCESS; RESUME when materialized non-empty"
  next: "DERIVED: Blocked[0] if blocked, else Pending[0] if pending, else closure_gaps[0] if exhausted AND closure pending, else 'none'. 'none' = TERMINAL."

blocker:
  tag: BLOCKER
  description: "Blocker classification"
  kind: "real | fake"
  claim: string
  real: "capability/dependency/knowledge gap — investigate or smoke-plan"
  fake: "unfinished prior task / sequencing — finish the task, do not halt"

# TASK STATUSES
task_statuses:
  tag: TASK_STATUSES
  enum: ["pending", "in_progress", "materialized", "blocked", "done", "out_of_scope"]
  transitions:
    pending:       [in_progress, out_of_scope]
    in_progress:   [materialized, blocked, pending]
    materialized:  [done, blocked, pending]
    blocked:       [pending]
    done:          []
    out_of_scope:  []

# ACTION CLASS
action_class:
  tag: ACTION_CLASS
  description: "Classification BEFORE execution (envelope model)"
  activity:
    enum: ["CONVERSATION", "OBSERVE", "EXECUTE_TEST", "MODIFY_CANDIDATE", "MODIFY_PROJECT", "PROMOTE_STABLE", "SELF_MODIFY"]
    CONVERSATION:      "no side effects"
    OBSERVE:           "read-only investigation"
    EXECUTE_TEST:      "run declared oracles"
    MODIFY_CANDIDATE:  "write within ExecutionEnvelope (pre-approved)"
    MODIFY_PROJECT:    "write outside envelope (requires @GATE_4_AUTHORIZE)"
    PROMOTE_STABLE:    "merge candidate→stable (ALWAYS explicit)"
    SELF_MODIFY:       "change kernel/agent/oracle (triple-separation)"
  effect:  ["NO_WRITE", "DECLARED_TEMP_WRITE", "CANDIDATE_WRITE", "PERSISTENT_WRITE"]
  risk:    ["LOW", "ELEVATED", "DESTRUCTIVE", "CRITICAL"]
  mapping:
    - "candidate branch → MODIFY_CANDIDATE + CANDIDATE_WRITE"
    - "mainline → MODIFY_PROJECT + PERSISTENT_WRITE"
    - "candidate→stable → PROMOTE_STABLE + PERSISTENT_WRITE"
    - "kernel/oracle/metric → SELF_MODIFY + PERSISTENT_WRITE"
    - "test/build/typecheck → EXECUTE_TEST"
    - "show/read/search → OBSERVE"
  invariants:
    - "CONVERSATION/OBSERVE ⇒ NO_WRITE"
    - "EXECUTE_TEST ⇒ no silent persistent write"
    - "MODIFY_CANDIDATE within envelope ⇒ pre-approved"
  explicit_approval_required:
    - "MODIFY_PROJECT (any envelope state)"
    - "PROMOTE_STABLE"
    - "SELF_MODIFY"
    - "protected-surface mutation"
    - "candidate work outside valid envelope"

# EXECUTION ENVELOPE
execution_envelope:
  tag: EXECUTION_ENVELOPE
  description: "Pre-approved authorization for MODIFY_CANDIDATE (authenticated, verifiable)"
  approval_payload:
    envelope_id: uuid
    revision: int
    issued_at: ISO-8601
    expires_at: ISO-8601
    approved_by: user
    scope_paths: "list of glob patterns"
    scope_spec_hash: "sha256(canonical(sorted scope_paths))"
    baseline_tree_hash: sha256
    budget:
      maximum_created: int
      maximum_modified: int
      maximum_deleted: int
    wall_time_seconds: int
    attempts_max: int
    allowed_action_classes: "list of activity values"
  approval_payload_hash: "sha256 (RFC 8785 JCS canonical serialization)"
  approval_attestation:
    algorithm: HMAC-SHA256
    key_id: string
    payload_hash: "sha256 (must == approval_payload_hash)"
    approval_event_id: uuid
    value: "hmac:..."
  mutable:
    status: "active | expired | revoked"
    mutation_ledger:
      created: "list of paths"
      modified: "list of paths"
      deleted: "list of paths"
      cumulative_delta_hash: sha256
  validation:
    - "1. status == active"
    - "2. now < expires_at"
    - "3. expires_at <= issued_at + wall_time_seconds"
    - "4. scope_spec_hash matches current"
    - "5. attestation.payload_hash == approval_payload_hash"
    - "6. HMAC(payload_hash, runtime_key) == attestation.value"
    - "7. activity ∈ allowed_action_classes"
    - "8. mutation_ledger counts within budget"
  path_auth: "normalize → resolve symlink/junction → case-normalize → verify inside approved root"
  unknown_activity: "RECLASSIFY_OR_DENY (fail-closed)"

# STAMPS
stamps:
  tag: STAMPS
  oracle_decl: "{claim: C_num, scope: str, cmd: str, criteria: str, res: enum[PASS, FAIL, TIMEOUT, CRASH]}"
  oracle_stamp: "{id: uuid, claim: C_num, scope_hash: sha256, attestation: hmac} -> sigma(c)=Exact"
  inference_stamp: "{id: uuid, claim: C_num, deps: [C_num], rule: str, derivation_hash: sha256} -> sigma(c)=Inferred"
  evidence_stamp: "{id: uuid, claim: C_num, source: handle, content_hash: sha256} -> sigma(c)=Exact"
  invariant: "unverified_exact_rejected; require_type_and_attestation; oracle_fail_demotes_to_guess"

# CLAIM LEDGER
claim_ledger:
  tag: CLAIM_LEDGER
  description: "All claims and epistemic status (REQUIRED for Gate 3)"
  claims:
    - id: "C1"
      text: string
      status: "Exact | Inferred | Hypothetical | Guess | Unknown"
      provenance: "CONTEXT | RETRIEVED | MODEL_PRIOR | INFERENCE | SYNTHESIS | UNKNOWN — origin of the claim"
      falsifier: "string (optional, for Hypothetical)"
      reason: string
      deps: "list of claim_ids (EpistemicDAG)"
      evidence: "string (for Exact)"
      scope: "file:lines (for Exact)"
  premises_for_plan: "list of claim_ids — MUST ⊆ G (Exact|Inferred)"
  open_questions: "list of claim_ids — must NOT drive MODIFY"
  rules:
    - "Unmarked ⇒ Unknown"
    - "Hypothetical in premises ⇒ plan illegal"
    - "effective(c) = min(status(c), min(effective(deps))) — weakest-link ceiling"
    - "Every claim MUST declare provenance; UNKNOWN provenance ⇒ non-actionable"
    - "MODEL_PRIOR claims must be verified externally before advancing beyond Hypothetical"

# OUTCOME CONTRACT
outcome_contract:
  tag: OUTCOME_CONTRACT
  description: "WHY layer — what must be true for the goal to be satisfied. Source of truth for @CLOSURE_PROOF acceptance criteria."
  acceptance_criteria: "list of oracle specs — each with {id, description, oracle_cmd, expected_result}"
  coverage_threshold: "float 0-1 — fraction of criteria that must PASS (default 1.0)"
  critical_risks: "list of risk_ids from @RISK_LEDGER that block outcome acceptance"
  invariant: "CLOSURE_PROOF.acceptance_coverage measured against THIS contract's criteria"

# RISK LEDGER
risk_ledger:
  tag: RISK_LEDGER
  description: "Real residual risks — not blocked by enforcement but relevant to outcome quality"
  risk_types:
    unresolved_external_dependency: "external system/service not verified"
    unverified_acceptance_criterion: "outcome criterion not yet oracle-tested"
    unresolved_safety_risk: "safety/security concern without mitigation"
    failed_nonblocking_oracle: "non-critical oracle failed but does not block MODIFY"
    architecture_concern: "design decision with unknown long-term impact"
  rules:
    - "Every open risk blocks CLOSURE_PROOF.outcome_oracle=PASS if listed in OUTCOME_CONTRACT.critical_risks"
    - "Risks are NOT premises — they do not block MODIFY, only outcome acceptance"

# QUALITY METRIC SPEC
quality_metric_spec:
  tag: QUALITY_METRIC_SPEC
  description: "Normalization contract for each QUALITY_VECTOR metric — makes D_i = w_i(1-Q_i) computable"
  metric:
    id: "unique metric identifier"
    unit: "ms | count | ratio | bytes | boolean | score"
    direction: "MAXIMIZE | MINIMIZE | TARGET"
    baseline: "current measured value"
    bad_reference: "worst-acceptable value — beyond this, metric is at floor (q=0)"
    target: "desired value"
    hard_limit: "value beyond which candidate is HARD DENIED"
    normalize: "function: q = clamp((bad_reference − actual) / (bad_reference − target), 0, 1) for MINIMIZE; mirror for MAXIMIZE"
    axis_weight: "float — relative weight within this axis (default: equal across all metrics in axis)"
    sample_window: "number of runs for stable measurement"
    repetitions: "minimum repetitions before accepting measurement"
    oracle: "command or test that produces the measurement"
    confidence: "0..1 — statistical confidence in current measurement"
  rule: "Axis score Q_i = Σ(w_ij * q_ij). Deficit D_i = w_i * (1 − Q_i)."

# QUALITY GUARDRAILS
quality_guardrails:
  tag: QUALITY_GUARDRAILS
  description: "Single source of hard-deny rules — referenced by both QUALITY_VECTOR and EVOLUTION_CANDIDATES"
  hard_deny:
    - "correctness regression > 0"
    - "stability regression > tolerance (adaptive/config parameter, default 0.05)"
    - "security regression > 0"
    - "architecture invariant violation"
    - "public contract broken without explicit ARCHITECTURE_EVOLUTION"
  rule: "No weighted utility score can override hard-deny. Referenced from @QUALITY_VECTOR.invariant and @EVOLUTION_CANDIDATES.validation."

# MIGRATION PROTOCOL
migration_protocol:
  tag: MIGRATION_PROTOCOL
  description: "State machine for architecture-displacing changes: NORMAL_EVOLUTION vs ARCHITECTURE_EVOLUTION vs MIGRATION"
  states:
    NORMAL_EVOLUTION: "improvement inside existing geometry — standard G1..G9"
    ARCHITECTURE_EVOLUTION: "geometry change without toolchain/language/platform change — requires architecture review"
    MIGRATION: "toolchain/runtime/language/framework/version change OR architecture_displacement > threshold"
  migration_requirements:
    - "explicit user authorization"
    - "isolated branch"
    - "full-project smoke/oracle baseline + verify"
    - "compatibility oracle"
    - "rollback proof"
  metrics:
    architecture_displacement: "normalized graph edit distance between old and new geometry"
    migration_amplification: "files touched / logical change size"
    compatibility_surface: "public APIs that must remain stable"
    geometry_preservation: "1 − NGED(G_before, G_after)"
    rollback_cost: "estimated effort to revert"
  rule: "MIGRATION requires explicit authorization and cannot be bundled with NORMAL_EVOLUTION improvements. Migration threshold is adaptive/config (default: architecture_displacement > 0.3)."

# CAPABILITY GRAPH
capability_graph:
  tag: CAPABILITY_GRAPH
  description: "What the project CAN do — nodes, edges, outcomes, evidence. Source for ΔG computation."
  nodes: "existing project capabilities"
  edges: "executable / semantic relations between capabilities"
  outcomes: "user-visible behaviors each capability provides"
  evidence: "code/tests/docs/oracles proving each node exists"
  rule: "USER_REQUEST is projected onto this graph; only UNCOVERED residual becomes EXECUTION_GOAL"

# INTENT PROJECTION
intent_projection:
  tag: INTENT_PROJECTION
  description: "Maps USER_REQUEST onto PROJECT_GEOMETRY + CAPABILITY_GRAPH. EXECUTION_GOAL = only unresolved ΔG."
  observation: "what user reports / requests"
  desired_outcome: "what should become true"
  suggested_solution: "optional user hypothesis — NOT automatically the Goal"
  constraints: "explicit user constraints"
  projection:
    matching_geometry_nodes: "geometry components relevant to request"
    existing_capabilities: "capability graph nodes covering parts of request"
    node_coverage: "0..1 — fraction of desired outcomes already covered"
    edge_coverage: "0..1 — fraction of capability relations already present"
    outcome_coverage: "0..1 — fraction of user-visible outcomes already satisfied"
  residual:
    delta_graph: "desired_graph − current_graph"
    execution_goal: "only unresolved verified residual becomes @GATE_2_DECOMPOSE input"
  invariant: "USER_REQUEST ≠ EXECUTION_GOAL. If ΔG=∅, implementation is SKIPPED — Oracle verifies existing capability."
  gate: "Feeds @GATE_1_GROUND → @GATE_2_DECOMPOSE. Replaces raw Goal→seeds with projected residual."

# PROJECT GEOMETRY
project_geometry:
  tag: PROJECT_GEOMETRY
  description: "Stable structural boundaries — evolution must happen INSIDE geometry, not by replacing it"
  components: "list of architectural components with responsibilities"
  dependency_graph: "allowed dependency edges between components"
  public_interfaces: "stable APIs that must not break without architecture evolution"
  stable_boundaries: "module boundaries that isolate change"
  stable_lanes: "directories where code is production-quality"
  experimental_lanes: "directories for experiments, futures, makeups"
  invariants:
    allowed_dependencies: "whitelist of permitted cross-component dependencies"
    forbidden_dependencies: "blacklist — e.g. no circular deps, no core→experimental"
    protected_interfaces: "interfaces that require architecture evolution candidate to modify"
    architectural_constraints: "global invariants e.g. no SQL in GUI layer"
  rule: "Improvement candidates that violate geometry → DENY or require explicit ARCHITECTURE_EVOLUTION"

# QUALITY VECTOR
quality_vector:
  tag: QUALITY_VECTOR
  description: "10-axis measurable project quality profile. Baseline → Target → Delta drives evolution candidates."
  axes:
    correctness:       {weight: 0.16, metrics: [requirement_coverage, oracle_pass_ratio, regression_count, invariant_violation_count]}
    stability:         {weight: 0.14, metrics: [crash_free_runs, timeout_rate, recovery_success_rate, resource_leak_slope]}
    performance:       {weight: 0.12, metrics: [startup_latency, p50_latency, p95_latency, peak_memory, throughput]}
    usability:         {weight: 0.12, metrics: [time_to_first_success, steps_to_primary_action, error_recovery_steps, interface_consistency]}
    automation:        {weight: 0.10, metrics: [manual_step_ratio, unattended_success_rate, api_coverage, determinism]}
    maintainability:   {weight: 0.12, metrics: [cognitive_complexity, change_amplification, duplication, testability]}
    architecture:      {weight: 0.10, metrics: [dependency_cycles, layer_violations, coupling, cohesion, geometry_preservation]}
    documentation:     {weight: 0.06, metrics: [example_pass_rate, stale_reference_rate, doc_code_divergence, onboarding_completeness]}
    observability:     {weight: 0.04, metrics: [failure_telemetry_coverage, actionable_error_ratio, diagnostic_latency]}
    security:          {weight: 0.04, metrics: [unsafe_default_count, secret_exposure, input_validation_coverage, privilege_surface]}
  invariant: "see @QUALITY_GUARDRAILS — single source for all hard-deny rules"

# EVOLUTION CANDIDATES
evolution_candidates:
  tag: EVOLUTION_CANDIDATES
  description: "After SUCCESS + quality analysis, generate 5 diverse improvement candidates via fractal geometry"
  generation:
    input: "@QUALITY_VECTOR deficit vector D_i = w_i * (1 - Q_i)"
    method: "4 largest semantic peaks → 4 focused candidates + 1 cross-axis candidate using @FRACTAL_GEOMETRY"
    clustering: "Manhattan L1 + k-medoids → 5 CENTRAL diverse candidates"
  validation:
    correctness_regression: "HARD DENY"
    stability_regression: "HARD DENY"
    security_regression: "HARD DENY"
    geometry_violation: "DENY unless explicit ARCHITECTURE_EVOLUTION candidate"
  fitness: "F(C) = (delta_Q * P_success * geometry_preservation * reversibility) / (1 + risk + cost)"
  pareto: "non-dominated candidates only"
  one_step_ahead: "forecast likely future problems; penalize candidates with high expected future regret"

# EVOLUTION CYCLE
evolution_cycle:
  tag: EVOLUTION_CYCLE
  description: "Outer loop: SUCCESS → quality analysis → candidate generation → selection → NEW_GOAL → full G1..G9"
  trigger: "@CLOSURE_PROOF = PASS AND @OUTCOME_CONTRACT outcome_oracle = PASS"
  baseline:
    - "snapshot_project: hash of project state at SUCCESS"
    - "build_project_geometry: extract current @PROJECT_GEOMETRY"
    - "calculate_quality_vector: measure all 10 axes"
  analysis:
    - "residual_quality_vector: D_i = w_i * (1 - Q_i)"
    - "regression_debt: accumulated regressions from prior evolution steps"
    - "quality_history: append current vector to generation log"
  candidate_generation: "see @EVOLUTION_CANDIDATES"
  selection: "best candidate by fitness; selected → NEW_GOAL (not MASTER_PLAN directly). GOAL then passes through G1→INTENT_PROJECTION→G2→G3→MASTER_PLAN. parent_goal_id preserved for lineage."
  saturation: "stop when max(F(C_i)) < F_min OR all delta_Q < epsilon — no improvement worth cost. F_min and epsilon are adaptive/config parameters (default: F_min=0.05, epsilon=0.02)."
  invariant: "Evolution candidate runs FULL GATED_WORKFLOW (G1..G9) — no shortcuts. parent_goal_id preserved for lineage."

# MASTER PLAN (updated)
master_plan:
  tag: MASTER_PLAN_SCHEMA
  description: "one-line goal"
  premises: "list of claim_ids (⊆ G only)"
  open_questions: "list of claim_ids"
  plan_id: "uuid — immutable; assigned at creation"
  revision: "int — starts at 1; increments on invalidation"
  created_by: "string — agent identity that authored the plan"
  lineage:
    parent_goal_id: "uuid|null — previous goal this plan continues"
    generation_id: "int — evolution generation number (0 for user-initiated)"
    evolution_candidate_id: "uuid|null — which @EVOLUTION_CANDIDATES entry spawned this"
    parent_project_snapshot: "sha256|null — project state hash at parent SUCCESS"
  state: "enum: DRAFT | ACTIVE | EXECUTING | VERIFYING | IMPLEMENTED | COMPLETED | INVALIDATED"
  lifecycle:
    DRAFT: "plan written, not yet authorized"
    ACTIVE: "authorized via @GATE_4_AUTHORIZE, ready for implementation"
    EXECUTING: "at least one task started via @GATE_7_IMPLEMENT"
    VERIFYING: "all tasks materialized; oracles running via @GATE_8_ORACLE"
    IMPLEMENTED: "all tasks done + all oracles PASS; awaiting outcome proof via @CLOSURE_PROOF"
    COMPLETED: "outcome proven: acceptance_coverage >= outcome_contract.coverage_threshold AND outcome_oracle=PASS per @OUTCOME_CONTRACT"
    INVALIDATED: "premise failed or scope changed; plan_reauthorization ALWAYS required; envelope_reissue only if scope/budget changed"
  goals:
    - id: GATE_1_GROUND
      sv: "list of keywords (3-9 terms)"
      document: "abstract + I/O + brief impl sketch"
      done_pct: int
      tasks:
        - id: T1
          sv: "list of keywords"
          what: "file-and-function level change"
          files: "list of paths"
          depends_on_claims: "list of claim_ids"
          oracle: "see @STAMPS"
          status: "[ ] = not done, [x] = done after @GATE_8_ORACLE oracle stamp"
          attempts: "int (default 0)"
          last_failure: "string or null"
          worker_id: "string or null"
          lease_expires_at: "ISO-8601 or null"
          action_class: "see @CLASSIFICATION"
  claim_ledger: "see @CLAIM_LEDGER"

# FRACTAL GEOMETRY
fractal_geometry:
  tag: FRACTAL_GEOMETRY
  models:
    Sierpinski:  { condition: "peaks ≥ 3, or peaks∈{4,8} ∧ orthogonality<0.7",  desc: "triangle subdivision" }
    QuadOct:     { condition: "peaks∈{2,4,8} ∧ (4,8 ⇒ orthogonality≥0.7)",      desc: "binary/quad/oct subdivision" }
    LSystem:     { condition: "peaks=1 or fallback",                              desc: "F→F+F−F grammar walk" }
  adaptive_tau:
    formula: "N<20 → τ=0.5; else τ=P₇₀({d₁(c,g)}); clamped [0.1, 0.9]"
  adaptive_k:
    formula: "k = 1 + ⌊(⌈N/2⌉−1)·min(CV,1.0)⌋; N=0→0, N=1→1, μ=0→k_min"
  adaptive_depth:
    formula: "base = 3 if peaks≥4 else 2 if peaks≥2 else 1; depth±1 by coverage≥0.80/≤0.35; clamped [1,3]"
  Manhattan_L1: "d₁(c,g) = Σₖ|w_c(k)−w_g(k)| — used throughout"
  k_medoids:    "PAM O(N²) for N<100; CLARA sampling min(N,40+2k)×5 reps for N≥100"
  orthogonality: "≥0.7→Quad-Oct (independent); <0.7→Sierpinski (interdependent)"

# SMOKE CONTRACT
smoke_contract:
  tag: SMOKE_CONTRACT
  description: "Pre-implementation smoke test (SMOKE_BEFORE)"
  smoke_na: "bool|string — if N/A, must justify (e.g. docs/plan-only)"
  baseline:
    - label: string
      cmd: "runnable command"
      expected_exit: "int (0=success)"
      tolerance: "int (optional, default 0)"
      tolerance_reason: "required if tolerance>0"
  post_checks:
    - label: string
      cmd: string
      expected_exit: int
  blast_radius: "description of affected files/systems"
  validation:
    - "¬smoke_na ⇒ ≥1 baseline check with label+cmd+expected_exit"
    - "tolerance>0 ⇒ tolerance_reason required"
    - "@GATE_4_AUTHORIZE rejects invalid specs"

# MESSAGE TAG
msg_tag:
  tag: MSG_TAG
  md5_msg_tag: "8-32 hex — content fingerprint via canonical serialization"
  serialization: "canonical=keys_sorted+weights_3dp+strings_nfc+prefix_rev"
  note: "NOT for cryptographic authorization — use SHA-256/BLAKE3 for stamps"

# MINOR SCHEMAS
signal_cluster:
  tag: SIGNAL_CLUSTER
  description: "Noise-filtered signal (Gate 1)"
  source: "lsp | test | log | tool | compiler | typecheck"
  pattern: "unresolved reference: Foo"
  n: "raw count"
  cardinality: "preserved for evidence — never discarded"
  unique_locations: "distinct file:line occurrences"
  delta: "Manhattan delta(signal, anchor)"
  likely_shared_root: bool
  disposition: "COLLAPSED_DUPLICATES | CONFIRMATION | DIVERGENCE"
  evidential_status: "ACTIVE (never discarded)"

bug_fix:
  tag: BUG_FIX_SCHEMA
  description: "Bug fix chain (@GATE_8_ORACLE)"
  symptom: string
  error_test: "{cmd, expect: FAIL, actual}"
  trial_fix: "{change, oracle: PASS}"
  real_fix: "{change, oracle: PASS}"
  targeted_tests: "{cmds: list, result: PASS}"
  status: "open | fixed"

explorer_goal:
  tag: EXPLORER_GOAL
  description: "Delegated exploration (Gate 6)"
  question: "specific question"
  scope: "{paths, symbols}"
  return: "[file_paths, line_numbers, signatures]"
  correct: "Find callers of X in src/tool/; paths, lines, signatures."
  wrong: "Search for path-related things."


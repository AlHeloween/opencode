# core_schemas.yaml — Single source of truth for all data structures.
# Version: 1.0
# All schema changes go HERE.  Fragments reference via @schema:section_name.
# Build pipeline (assemble_reasoning) resolves refs and injects YAML inline.
# The model sees full schemas; the developer edits only this file.

version: "1.0"

# GATES — 9-gate workflow spine
# rules/steps/diagrams/schemas MUST be @REFS into RULES / Algorithms / Schemas / Diagrams.
# Bare identifiers (e.g. SV_EVERY_TURN without @) are bugs — not dictionary lookups.
gates:
  G1:
    tag: G1
    name: GROUND
    rules: ["@EVIDENCE_ORDER", "@SEARCH_ORDER", "@WHERE_WHICH", "@REUSE_BEFORE", "@GROUND", "@NO_HARDCODE", "@VCS_ROOT", "@READ_ENTIRE_FILE"]
    steps: ["@GROUND", "@SEARCH_ORDER", "@REUSE_BEFORE"]
    diagram: "@NOISE_FILTER_DIAGRAM"
    schemas: ["@ACTION_CLASS", "@SIGNAL_CLUSTER"]
    description: "Read current state before judgment — files, logs, tests, conversation. Every observation from concrete tool read or oracle output. Resolve each @RULE in rules: to RULES body."
    search_intent:
      EXECUTABLE_LOCATION: "where/which — instant, PATH-aware"
      CODE_STRUCTURE: "codegraph → bounded read/grep"
      CONVERSATION_FACT: "messagesearch → session-read"
      PUBLIC_API_VERSION: "universalsearch web+code (or hybrid)"
      HARDWARE_STATE: "native diagnostics — OS/host, NOT tool-loop"
      UNKNOWN_ROOT_CAUSE: "local evidence first → external universalsearch"
    # search_intent table is G1-local routing surface; @SEARCH_ORDER / @GROUND point here via See: @G1.search_intent

  G2:
    tag: G2
    name: DECOMPOSE
    rules: ["@DECOMPOSE", "@FRACTAL_CANDIDATES", "@GOAL_SEEDS", "@GOAL_PEAKS", "@SV_DELTA", "@METRIC_ADAPTATION"]
    # Ordered apply chain — bodies live in RULES / @FRACTAL_GEOMETRY only (no prose recipes).
    steps: ["@GOAL_SEEDS", "@GOAL_PEAKS", "@FRACTAL_CANDIDATES", "@DECOMPOSE", "@SV_DELTA", "@METRIC_ADAPTATION"]
    geometry: "@FRACTAL_GEOMETRY"
    diagram: "@FRACTAL_PIPELINE"
    invariant: "CENTRAL_TASKS=medoids only. No Mode-1 linear lists."

  G3:
    tag: G3
    name: MASTER_PLAN
    rules: ["@SMOKE_BEFORE", "@SMOKE_SPEC", "@SMOKE_VALIDATE", "@INFOMARK_SEP"]
    steps: ["@SMOKE_SPEC", "@SMOKE_VALIDATE", "@SMOKE_BEFORE"]
    description: "Emit master_plan + claim_ledger. premises_for_plan ⊆ G (Exact|Inferred, stamped). Resolve @RULE bodies from RULES."
    contradictions: "Track conflicting claims in @CLAIM_LEDGER. When C_i.status=Exact and C_j.status=Exact but C_i contradicts C_j → both demote to Inferred, flag contradiction, re-verify."
    schemas: ["@MASTER_PLAN_SCHEMA", "@CLAIM_LEDGER"]

  G4:
    tag: G4
    name: AUTHORIZE
    rules: ["@WRITE_SCOPE"]
    steps: ["@WRITE_SCOPE", "@ACTION_CLASS", "@EXECUTION_ENVELOPE"]
    diagram: "@AUTH_RESOLVER"
    schemas: ["@EXECUTION_ENVELOPE", "@ACTION_CLASS"]
    description: "Authorization resolver — not unconditional approval. Resolve @RULE / @SCHEMA refs."
    branches:
      A:
        name: APPROVED_BY_ENVELOPE
        condition: "MODIFY_CANDIDATE ∧ valid envelope ∧ paths⊆scope"
        action: "→ G6 directly, no prompt"
      B:
        name: EXPLICIT_USER_APPROVAL
        condition: "PROMOTE_STABLE ∨ SELF_MODIFY ∨ protected surface"
        action: "present plan, ask 'Do you approve?'"
      C:
        name: PRESENT_CONTRACT_AND_ASK
        condition: "MODIFY_PROJECT ∨ MODIFY_CANDIDATE without valid envelope"
        action: "present contract, ask for approval"
    unknown: "RECLASSIFY_OR_DENY — fail-closed"

  G5:
    tag: G5
    name: CONCERN_LOOP
    rules: ["@WRITE_SCOPE", "@DECOMPOSE", "@SMOKE_BEFORE"]
    steps: ["@G2", "@G3", "@G4"]
    description: "User objects → return to @G2. Refine, re-present, re-ask @G4. Resolve @RULE / @G refs."

  G6:
    tag: G6
    name: GROUND_PLAN
    rules: ["@SEARCH_ORDER", "@REUSE_BEFORE"]
    steps: ["@SEARCH_ORDER", "@REUSE_BEFORE"]
    diagram: "@GROUND_PHASES"
    phases:
      - "Phase 0: Structure map — codegraph/symbol impact for plan files (@SEARCH_ORDER CODE_STRUCTURE)"
      - "Phase 1: Broad explore — bounded targets only"
      - "Phase 2: Gap fill — @REUSE_BEFORE web+code for external claims"
    schemas: ["@EXPLORER_GOAL"]

  G7:
    tag: G7
    name: IMPLEMENT
    rules: ["@CACHE_STABILITY", "@CONSTITUTION_BLOCKS", "@ADID_OPS", "@NO_SCRIPT_EDITING", "@READ_ENTIRE_FILE"]
    steps: ["@READ_ENTIRE_FILE", "@ADID_OPS", "@CONSTITUTION_BLOCKS", "@CACHE_STABILITY"]
    description: "Implement exactly the approved plan. Inspect target first, state semantic delta. Resolve each @RULE."
    schemas: ["@EXECUTION_ENVELOPE"]
    hard_gate: "Runtime blocks edit/write if premises_for_plan ⊄ G."
    deviation: "→ @G5 re-approval"

  G8:
    tag: G8
    name: ORACLE
    rules: ["@VERIFY_OUTCOME", "@SMOKE_VERIFY"]
    steps: ["@VERIFY_OUTCOME", "@SMOKE_VERIFY", "@BUG_FIX_CHAIN"]
    result: "r∈{PASS,FAIL,TIMEOUT,CRASH}"
    on_pass: "oracle_stamp → σ(c)=Exact (scoped)"
    on_fail:
      failed_hypothesis: "→ Guess (evidence remains)"
      regression: "→ Guess (was Exact, now contradicted)"
      evidence_destroyed: "→ Unknown (foundation gone)"
    diagram: "@ORACLE_SEQUENCE"
    self_certify: "Bare [Exact] without stamp = REJECTED. Only system stamps mint Exact."
    cross_verify: "At least 2 independent evidence sources before Exact stamp. Single oracle = Inferred ceiling. Multi-source convergence → Exact candidate."
    schemas: ["@STAMPS", "@BUG_FIX_SCHEMA"]

  G9:
    tag: G9
    name: CLEAN_STATE
    rules: ["@CLEAN_STATE", "@SV_OUTPUT", "@SV_EVERY_TURN", "@RESIDUAL_LOOP", "@EMIT_STATE", "@PLANS_COMPLETED"]
    steps: ["@EMIT_STATE", "@CLEAN_STATE", "@SV_EVERY_TURN", "@SV_OUTPUT", "@RESIDUAL_LOOP", "@PLANS_COMPLETED"]
    description: "End every response with clean_next_state + sv_output. Resolve @SV_EVERY_TURN → RULES → @SV_FORMAT."
    residual: "@RESIDUAL_LOOP — ADID loop closure"
    schemas: ["@CLEAN_NEXT_STATE", "@SV_OUTPUT_SCHEMA", "@MSG_TAG", "@BLOCKER"]
    depth_metric: "evidence_coverage = |resolved_symbols| / |required_symbols|. coverage≥0.80 → shallow lattice (well-mapped). coverage≤0.35 → deep lattice (unexplored). Track per-task and accumulate across session."

  # Cross-cutting RULES not exclusive to one gate — still must be @refs when applied.
  CC:
    tag: CC
    name: CROSS_CUTTING
    rules: ["@MEMORY_RANK", "@MEMORY_LINKS", "@ADID_FREEZE", "@TONE_AND_STYLE", "@NAMING", "@DOCUMENT_SURFACE", "@WORKSPACE_LANES", "@PROGRESS_LOG"]
    description: "Always-on dictionary rules. Resolve each @RULE from RULES. Not a spine gate — apply alongside active @Gn."

# SEMANTIC VECTOR (SV)
sv_output:
  tag: SV_OUTPUT_SCHEMA
  see: "@SV_FORMAT"

# CLEAN NEXT STATE
clean_next_state:
  tag: CLEAN_NEXT_STATE
  description: "Structured state summary after each substantial turn"
  reason: string
  done: "list of {item: string, pct: int 0-100, mark: EpistemicStatus}"
  pending: "list of string"
  blocked: "list of {item: string, kind: real|fake, reason: string}"
  out_of_scope: "list of string — tasks discarded by residual_recluster"
  terminal: "bool — true when pending=[] AND active=[]"
  terminal_mode:
    enum: ["SUCCESS", "BLOCKED", "OUT_OF_SCOPE", "CONTINUE", "RESUME"]
    precedence: "BLOCKED > OUT_OF_SCOPE > SUCCESS; RESUME when materialized non-empty"
  next: "DERIVED, not invented: Blocked[0] if blocked, else Pending[0] if pending, else 'none'. 'none' = TERMINAL hard stop."

blocker:
  tag: BLOCKER
  description: "Blocker classification"
  kind: "real | fake"
  claim: string
  real: "capability/dependency/knowledge gap — investigate or smoke-plan"
  fake: "unfinished prior task / sequencing — finish the task, do not halt"

# TASK STATUSES
task_statuses:
  tag: TASK_STATUSES
  enum: ["pending", "in_progress", "materialized", "blocked", "done", "out_of_scope"]
  transitions:
    pending:       [in_progress, out_of_scope]
    in_progress:   [materialized, blocked, pending]
    materialized:  [done, blocked, pending]
    blocked:       [pending]
    done:          []
    out_of_scope:  []

# ACTION CLASS
action_class:
  tag: ACTION_CLASS
  description: "Classification BEFORE execution (envelope model)"
  activity:
    enum: ["CONVERSATION", "OBSERVE", "EXECUTE_TEST", "MODIFY_CANDIDATE", "MODIFY_PROJECT", "PROMOTE_STABLE", "SELF_MODIFY"]
    CONVERSATION:      "no side effects"
    OBSERVE:           "read-only investigation"
    EXECUTE_TEST:      "run declared oracles"
    MODIFY_CANDIDATE:  "write within ExecutionEnvelope (pre-approved)"
    MODIFY_PROJECT:    "write outside envelope (requires @G4)"
    PROMOTE_STABLE:    "merge candidate→stable (ALWAYS explicit)"
    SELF_MODIFY:       "change kernel/agent/oracle (triple-separation)"
  effect:  ["NO_WRITE", "DECLARED_TEMP_WRITE", "CANDIDATE_WRITE", "PERSISTENT_WRITE"]
  risk:    ["LOW", "ELEVATED", "DESTRUCTIVE", "CRITICAL"]
  mapping:
    - "candidate branch → MODIFY_CANDIDATE + CANDIDATE_WRITE"
    - "mainline → MODIFY_PROJECT + PERSISTENT_WRITE"
    - "candidate→stable → PROMOTE_STABLE + PERSISTENT_WRITE"
    - "kernel/oracle/metric → SELF_MODIFY + PERSISTENT_WRITE"
    - "test/build/typecheck → EXECUTE_TEST"
    - "show/read/search → OBSERVE"
  invariants:
    - "CONVERSATION/OBSERVE ⇒ NO_WRITE"
    - "EXECUTE_TEST ⇒ no silent persistent write"
    - "MODIFY_CANDIDATE within envelope ⇒ pre-approved"
  explicit_approval_required:
    - "MODIFY_PROJECT (any envelope state)"
    - "PROMOTE_STABLE"
    - "SELF_MODIFY"
    - "protected-surface mutation"
    - "candidate work outside valid envelope"

# EXECUTION ENVELOPE
execution_envelope:
  tag: EXECUTION_ENVELOPE
  description: "Pre-approved authorization for MODIFY_CANDIDATE (authenticated, verifiable)"
  approval_payload:
    envelope_id: uuid
    revision: int
    issued_at: ISO-8601
    expires_at: ISO-8601
    approved_by: user
    scope_paths: "list of glob patterns"
    scope_spec_hash: "sha256(canonical(sorted scope_paths))"
    baseline_tree_hash: sha256
    budget:
      maximum_created: int
      maximum_modified: int
      maximum_deleted: int
    wall_time_seconds: int
    attempts_max: int
    allowed_action_classes: "list of activity values"
  approval_payload_hash: "sha256 (RFC 8785 JCS canonical serialization)"
  approval_attestation:
    algorithm: HMAC-SHA256
    key_id: string
    payload_hash: "sha256 (must == approval_payload_hash)"
    approval_event_id: uuid
    value: "hmac:..."
  mutable:
    status: "active | expired | revoked"
    mutation_ledger:
      created: "list of paths"
      modified: "list of paths"
      deleted: "list of paths"
      cumulative_delta_hash: sha256
  validation:
    - "1. status == active"
    - "2. now < expires_at"
    - "3. expires_at <= issued_at + wall_time_seconds"
    - "4. scope_spec_hash matches current"
    - "5. attestation.payload_hash == approval_payload_hash"
    - "6. HMAC(payload_hash, runtime_key) == attestation.value"
    - "7. activity ∈ allowed_action_classes"
    - "8. mutation_ledger counts within budget"
  path_auth: "normalize → resolve symlink/junction → case-normalize → verify inside approved root"
  unknown_activity: "RECLASSIFY_OR_DENY (fail-closed)"

# STAMPS
stamps:
  tag: STAMPS
  _base: &stamp_base
    stamp_id: uuid
    claim_id: "C<number>"
    claim_revision: "int (monotonic per claim)"
    claim_scope_hash: sha256
    issued_at: ISO-8601
    expires_at: ISO-8601
    issuer_principal_id: string
    source_hash: sha256
    attestation: "runtime cryptographic signature"
    rule: "No text with result:PASS alone is a valid stamp — type+issuer+attestation required"

  oracle:
    description: "Oracle declaration (NOT a stamp — used in master_plan tasks)"
    claim_id: string
    claim_scope: "what fact becomes Exact on PASS"
    cmd: "cwd + command"
    pass: "criteria"
    result: "PASS | FAIL | TIMEOUT | CRASH"

  oracle_stamp:
    <<: *stamp_base
    stamp_type: ORACLE
    result: PASS
    effect: "σ(c) = Exact (scoped to claim_scope)"

  inference_stamp:
    <<: *stamp_base
    stamp_type: INFERENCE
    derivation_rule: "which rule produced this claim"
    dependencies: "list of claim_ids"
    dependency_effective_status: "dict(claim_id → status)"
    derivation_hash: "sha256 (deterministic hash of inputs)"
    result: "VALID | INVALID"
    preconditions:
      - "All dependencies ∈ G (effective ≥ Inferred)"
      - "Derivation rule declared"
      - "Derivation hash matches"
      - "No circular dependency → Unknown"
    effect: "VALID ⇒ σ(c) = Inferred (system-stamped, eligible for G)"

  direct_evidence_stamp:
    <<: *stamp_base
    stamp_type: DIRECT_EVIDENCE
    source_type: "file_read | session_read | tool_result"
    source_handle: "path or session id"
    source_revision: "commit hash"
    content_hash: sha256
    scope: "line range or specific context"
    result: VALID

# CLAIM LEDGER
claim_ledger:
  tag: CLAIM_LEDGER
  description: "All claims and epistemic status (REQUIRED for Gate 3)"
  claims:
    - id: "C1"
      text: string
      status: "Exact | Inferred | Hypothetical | Guess | Unknown"
      falsifier: "string (optional, for Hypothetical)"
      reason: string
      deps: "list of claim_ids (EpistemicDAG)"
      evidence: "string (for Exact)"
      scope: "file:lines (for Exact)"
  premises_for_plan: "list of claim_ids — MUST ⊆ G (Exact|Inferred)"
  open_questions: "list of claim_ids — must NOT drive MODIFY"
  rules:
    - "Unmarked ⇒ Unknown"
    - "Hypothetical in premises ⇒ plan illegal"
    - "effective(c) = min(status(c), min(effective(deps))) — weakest-link ceiling"

# MASTER PLAN
master_plan:
  tag: MASTER_PLAN_SCHEMA
  description: "one-line goal"
  premises: "list of claim_ids (⊆ G only)"
  open_questions: "list of claim_ids"
  goals:
    - id: G1
      sv: "list of keywords (3-9 terms)"
      document: "abstract + I/O + brief impl sketch"
      done_pct: int
      tasks:
        - id: T1
          sv: "list of keywords"
          what: "file-and-function level change"
          files: "list of paths"
          depends_on_claims: "list of claim_ids"
          oracle: "see @STAMPS"
          status: "[ ] | [x] — [x] only after @G8 + stamp"
          attempts: "int (default 0)"
          last_failure: "string or null"
          worker_id: "string or null"
          lease_expires_at: "ISO-8601 or null"
          action_class: "see @ACTION_CLASS"
  claim_ledger: "see @CLAIM_LEDGER"

# FRACTAL GEOMETRY
fractal_geometry:
  tag: FRACTAL_GEOMETRY
  models:
    Sierpinski:  { condition: "peaks ≥ 3, or peaks∈{4,8} ∧ orthogonality<0.7",  desc: "triangle subdivision" }
    QuadOct:     { condition: "peaks∈{2,4,8} ∧ (4,8 ⇒ orthogonality≥0.7)",      desc: "binary/quad/oct subdivision" }
    LSystem:     { condition: "peaks=1 or fallback",                              desc: "F→F+F−F grammar walk" }
  adaptive_tau:
    formula: "N<20 → τ=0.5; else τ=P₇₀({d₁(c,g)}); clamped [0.1, 0.9]"
  adaptive_k:
    formula: "k = 1 + ⌊(⌈N/2⌉−1)·min(CV,1.0)⌋; N=0→0, N=1→1, μ=0→k_min"
  adaptive_depth:
    formula: "base = 3 if peaks≥4 else 2 if peaks≥2 else 1; depth±1 by coverage≥0.80/≤0.35; clamped [1,3]"
  Manhattan_L1: "d₁(c,g) = Σₖ|w_c(k)−w_g(k)| — used throughout"
  k_medoids:    "PAM O(N²) for N<100; CLARA sampling min(N,40+2k)×5 reps for N≥100"
  orthogonality: "≥0.7→Quad-Oct (independent); <0.7→Sierpinski (interdependent)"

# SMOKE CONTRACT
smoke_contract:
  tag: SMOKE_CONTRACT
  description: "Pre-implementation smoke test (SMOKE_BEFORE)"
  smoke_na: "bool|string — if N/A, must justify (e.g. docs/plan-only)"
  baseline:
    - label: string
      cmd: "runnable command"
      expected_exit: "int (0=success)"
      tolerance: "int (optional, default 0)"
      tolerance_reason: "required if tolerance>0"
  post_checks:
    - label: string
      cmd: string
      expected_exit: int
  blast_radius: "description of affected files/systems"
  validation:
    - "¬smoke_na ⇒ ≥1 baseline check with label+cmd+expected_exit"
    - "tolerance>0 ⇒ tolerance_reason required"
    - "@G4 rejects invalid specs"

# MESSAGE TAG
msg_tag:
  tag: MSG_TAG
  md5_msg_tag: "8-32 hex — content fingerprint via canonical serialization"
  serialization: "canonical=keys_sorted+weights_3dp+strings_nfc+prefix_rev"
  note: "NOT for cryptographic authorization — use SHA-256/BLAKE3 for stamps"

# MINOR SCHEMAS
signal_cluster:
  tag: SIGNAL_CLUSTER
  description: "Noise-filtered signal (Gate 1)"
  source: "lsp | test | log | tool | compiler | typecheck"
  pattern: "unresolved reference: Foo"
  n: "raw count"
  cardinality: "preserved for evidence — never discarded"
  unique_locations: "distinct file:line occurrences"
  delta: "Manhattan delta(signal, anchor)"
  likely_shared_root: bool
  disposition: "COLLAPSED_DUPLICATES | CONFIRMATION | DIVERGENCE"
  evidential_status: "ACTIVE (never discarded)"

bug_fix:
  tag: BUG_FIX_SCHEMA
  description: "Bug fix chain (@G8)"
  symptom: string
  error_test: "{cmd, expect: FAIL, actual}"
  trial_fix: "{change, oracle: PASS}"
  real_fix: "{change, oracle: PASS}"
  targeted_tests: "{cmds: list, result: PASS}"
  status: "open | fixed"

explorer_goal:
  tag: EXPLORER_GOAL
  description: "Delegated exploration (Gate 6)"
  question: "specific question"
  scope: "{paths, symbols}"
  return: "[file_paths, line_numbers, signatures]"
  correct: "Find callers of X in src/tool/; paths, lines, signatures."
  wrong: "Search for path-related things."

# DOMAIN SOURCES
domain_sources:
  tag: DOMAIN_SOURCES
  rule: check domain authority before universalsearch
  physics: [arXiv, INSPEC, IOPscience, APS_Journals, NASA_ADS]
  biology: [PubMed, BioRxiv, GenBank, NCBI_Taxonomy]
  chemistry: [PubChem, ChemRxiv, Reaxys, NIST_WebBook]
  materials: [mdx, MaterialsProject, SpringerMaterials, MatWeb]
  medicine: [PubMed, MEDLINE, CINAHL, CochraneLibrary]
  engineering: [IEEEXplore, Compendex, INSPEC, EngineeringVillage]
  cs: [ACM_DL, IEEEXplore, CiteSeerX, arXiv_CS]
  geology: [GeoRef, GeoScienceWorld, USGS_Pubs]
  sociology: [SocINDEX, SocAbstracts, ICPSR, AgeLine]
  law: [HeinOnline, Westlaw, LexisNexis, ScholarCaseLaw]
  economics: [RePEc, FRED, WorldBankData, NBER]
  history: [JSTOR, HathiTrust, InternetArchive, ProjectMUSE]
  psychology: [PsycINFO, PubMed, OSF_Preprints, PsycArticles]
  education: [ERIC, EdSource, LearnTechLib, OECD_Ed]
  anthropology: [AIO, AnthroSource, eHRAF]
  agriculture: [AGRICOLA, AGRIS, CAB_Abstracts, FAO]
